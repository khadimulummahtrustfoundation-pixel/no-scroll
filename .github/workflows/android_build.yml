name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create local.properties
        run: |
          echo "INSTAGRAM_ID=${{ secrets.INSTAGRAM_ID }}" >> local.properties
          echo "YOUTUBE_ID=${{ secrets.YOUTUBE_ID }}" >> local.properties
          echo "LINKEDIN_ID=${{ secrets.LINKEDIN_ID }}" >> local.properties
          echo "SNAPCHAT_ID=${{ secrets.SNAPCHAT_ID }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
